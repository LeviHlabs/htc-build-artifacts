name: Upload build chunks
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-build-chunks.yml]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify exact archive
        run: |
          curl --fail --location --output /tmp/chunks.tar.gz 'https://n.uguu.se/WXkHxkeH.tar.gz'
          echo 'b3b4912298a5cf40d9f85c6418714eff2dcd224e256df0eaa66b10a41a1b2493  /tmp/chunks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/chunks.tar.gz
      - name: Commit every chunk separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in $(seq -w 5 21); do
            name="p0${n}.txt"
            git add -- "$name"
            git commit -m "Add $name build chunk"
          done
          git rm .github/workflows/upload-build-chunks.yml
          git commit -m 'Remove temporary build chunk uploader'
          git push origin main
